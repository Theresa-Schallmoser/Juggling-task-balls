<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Task Bälle</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'PT Sans', Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    h2 { margin-top: 20px; }

    #inputContainer { margin: 10px; }

    input, select {
        margin: 5px;
        padding: 8px;
        width: 150px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 10px 15px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }

    canvas {
        display: block;
        margin: 20px auto;
        background: #111;
    }
</style>
</head>

<body>

<h2>Meine Aufgaben</h2>

<div id="inputContainer"></div>

<button onclick="addBall()">➕ Ball hinzufügen</button>
<button onclick="resetStorage()" style="background:#e53935;">🗑 Reset</button>

<canvas id="canvas" width="1000" height="300"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let balls = [];
let particles = [];

const colors = [
    "#FF5252","#FF9800","#FFEB3B",
    "#4CAF50","#2196F3","#9C27B0","#00BCD4"
];

const MAX_BALLS = 6;

let draggingIndex = null;
let offsetX = 0;
let offsetY = 0;

/* =========================
   SPEICHERUNG
========================= */

function saveBalls() {
    localStorage.setItem("taskBalls", JSON.stringify(balls));
}

/* =========================
   BALL HINZUFÜGEN
========================= */

function addBall(text = "") {

    if (balls.length >= MAX_BALLS) {
        alert("Maximal 6 Bälle erlaubt!");
        return;
    }

    const i = balls.length;

    balls.push({
        text: text,
        color: colors[i % colors.length],
        x: 100 + i * 160,
        y: 150,
        scale: 0.2,
        size: "mittel",
        popping: false
    });

    renderInputs();
    saveBalls();
}

/* =========================
   GRÖSSE
========================= */

function getBallRadius(ball) {

    let baseRadius = 50;

    if (ball.size === "klein") baseRadius = 35;
    if (ball.size === "mittel") baseRadius = 50;
    if (ball.size === "groß") baseRadius = 70;

    return baseRadius * ball.scale;
}

/* =========================
   POP EFFECT
========================= */

function createPopEffect(ball) {

    for (let i = 0; i < 25; i++) {

        particles.push({
            x: ball.x,
            y: ball.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 6 + 2,
            life: 30,
            color: ball.color
        });
    }
}

/* =========================
   DELETE
========================= */

function deleteBall(index) {

    const ball = balls[index];

    createPopEffect(ball);

    balls.splice(index, 1);

    renderInputs();
    saveBalls();
}

/* =========================
   UPDATE TEXT / SIZE
========================= */

function updateText(index, value) {
    balls[index].text = value;
    saveBalls();
}

function updateSize(index, value) {
    balls[index].size = value;
    saveBalls();
}

/* =========================
   INPUTS
========================= */

function renderInputs() {

    const container = document.getElementById("inputContainer");

    container.innerHTML = "";

    balls.forEach((ball, i) => {

        const wrapper = document.createElement("div");

        const input = document.createElement("input");
        input.value = ball.text;
        input.placeholder = "Ball " + (i + 1);
        input.oninput = (e) => updateText(i, e.target.value);

        const select = document.createElement("select");

        ["klein", "mittel", "groß"].forEach(size => {

            const option = document.createElement("option");
            option.value = size;
            option.textContent = size;

            if (ball.size === size) option.selected = true;

            select.appendChild(option);
        });

        select.onchange = (e) => updateSize(i, e.target.value);

        const del = document.createElement("button");
        del.textContent = "❌";
        del.onclick = () => deleteBall(i);

        wrapper.appendChild(input);
        wrapper.appendChild(select);
        wrapper.appendChild(del);

        container.appendChild(wrapper);
    });
}

/* =========================
   DRAW LOOP
========================= */

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    balls.forEach((ball) => {

        ball.scale += (1 - ball.scale) * 0.1;

        const radius = getBallRadius(ball);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        let fontSize = 14;

        if (ball.size === "groß") fontSize = 18;
        if (ball.size === "klein") fontSize = 11;

        if (ball.text.length > 20) fontSize -= 2;
        if (ball.text.length > 30) fontSize -= 2;

        ctx.font = `bold ${fontSize}px 'PT Sans'`;

        wrapText(ball.text, ball.x, ball.y, radius * 1.5, fontSize + 2);
    });

    particles.forEach((p, i) => {

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;

        if (p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(draw);
}

/* =========================
   TEXT WRAP
========================= */

function wrapText(text, x, y, maxWidth, lineHeight) {

    ctx.fillStyle = "black";

    const words = text.split(" ");
    let line = "";
    let lines = [];

    for (let n = 0; n < words.length; n++) {

        let testLine = line + words[n] + " ";
        let testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && n > 0) {
            lines.push(line);
            line = words[n] + " ";
        } else {
            line = testLine;
        }
    }

    lines.push(line);

    for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, y - (lines.length / 2 - i) * lineHeight);
    }
}

/* =========================
   DRAG & DROP
========================= */

canvas.addEventListener("mousedown", (e) => {

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    balls.forEach((ball, i) => {

        const dx = mx - ball.x;
        const dy = my - ball.y;

        if (Math.sqrt(dx * dx + dy * dy) < getBallRadius(ball)) {

            draggingIndex = i;
            offsetX = dx;
            offsetY = dy;
        }
    });
});

canvas.addEventListener("mousemove", (e) => {

    if (draggingIndex === null) return;

    const rect = canvas.getBoundingClientRect();

    balls[draggingIndex].x =
        e.clientX - rect.left - offsetX;

    balls[draggingIndex].y =
        e.clientY - rect.top - offsetY;
});

canvas.addEventListener("mouseup", () => {

    if (draggingIndex !== null) saveBalls();

    draggingIndex = null;
});

canvas.addEventListener("mouseleave", () => {
    draggingIndex = null;
});

/* =========================
   RESET
========================= */

function resetStorage() {

    localStorage.removeItem("taskBalls");
    location.reload();
}

/* =========================
   START (LOAD)
========================= */

const saved = localStorage.getItem("taskBalls");

if (saved) {

    balls = JSON.parse(saved);

} else {

    addBall("Task 1");
    addBall("Task 2");
    addBall("Task 3");
}

renderInputs();
draw();

</script>

</body>
</html>
