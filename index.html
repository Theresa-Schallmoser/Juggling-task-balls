<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Bälle</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #111;
        --panel: #181818;
        --panel-2: #222;
        --line: #2e2e2e;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --accent: #4CAF50;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        margin: 0;
        font-family: 'PT Sans', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
    }

    header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
    }

    h1 { margin: 0; font-size: 24px; }

    #date {
        color: var(--muted);
        font-size: 15px;
        font-weight: 400;
        margin-left: 8px;
    }

    main {
        flex: 1;
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: 0;
    }

    aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
    }

    #list { display: flex; flex-direction: column; gap: 8px; }

    .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid transparent;
    }

    .row:focus-within { border-color: #555; }

    .dot {
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.25);
        cursor: pointer;
    }

    .row input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #111;
        color: var(--text);
        font: inherit;
    }

    .row select {
        padding: 8px 4px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #111;
        color: var(--text);
        font: inherit;
    }

    .icon-btn {
        flex: none;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 17px;
        cursor: pointer;
    }

    .icon-btn:hover { background: #333; color: var(--text); }
    .icon-btn.del:hover { color: #ff6b6b; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .btn {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
    }

    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.secondary { background: #2c2c2c; color: var(--text); }
    .btn.secondary[aria-pressed="true"] { background: #3d3d3d; box-shadow: inset 0 0 0 1px #777; }
    .btn.danger { background: transparent; color: #ff8a80; border: 1px solid #5a2a2a; }

    #limitHint { color: var(--muted); font-size: 13px; min-height: 1em; }

    .hint {
        margin: auto 0 0;
        padding-top: 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
    }

    #stage { position: relative; min-width: 0; min-height: 0; }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
    }

    #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 12px 10px 16px;
        border-radius: 10px;
        background: #2a2a2a;
        border: 1px solid #444;
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
    }

    #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

    #undoBtn {
        background: none;
        border: none;
        color: #7bd67f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    @media (max-width: 800px) {
        body { height: auto; min-height: 100%; }
        main { flex: none; grid-template-columns: 1fr; grid-template-rows: auto 460px; }
        aside { border-right: none; border-bottom: 1px solid var(--line); }
    }
</style>
</head>

<body>

<header>
    <h1>Meine Aufgaben <span id="date"></span></h1>
</header>

<main>
    <aside>
        <div id="list"></div>

        <div class="actions">
            <button class="btn" id="addBtn">➕ Ball hinzufügen</button>
            <button class="btn secondary" id="zonesBtn" aria-pressed="false">Zonen</button>
            <button class="btn danger" id="resetBtn">Alles löschen</button>
        </div>

        <div id="limitHint"></div>

        <p class="hint">
            Bälle ziehen zum Anordnen · Doppelklick auf einen Ball = erledigt (platzen lassen) ·
            Enter im Textfeld = neuer Ball · Klick auf den Farbpunkt wechselt die Farbe
        </p>
    </aside>

    <div id="stage"><canvas id="canvas"></canvas></div>
</main>

<div id="toast" role="status"><span id="toastText"></span><button id="undoBtn">Rückgängig</button></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");

const COLORS = ["#FF5252", "#FF9800", "#FFEB3B", "#4CAF50", "#2196F3", "#9C27B0", "#00BCD4", "#F06292"];
const MAX_BALLS = 6;
const SIZES = { "klein": 42, "mittel": 60, "groß": 88 };
const FONT_BASE = { "klein": 13, "mittel": 16, "groß": 20 };
const ZONES = ["Heute", "Morgen", "Diese Woche"];
const STORAGE_KEY = "taskBalls.v2";
const LEGACY_KEY = "taskBalls";
const FONT = "'PT Sans', Arial, sans-serif";

let state = { showZones: false, balls: [] };
let particles = [];
let W = 1, H = 1, dpr = 1;
let drag = null;
let lastTap = { id: null, time: 0 };
let focusedId = null;
let undoInfo = null;
let toastTimer = null;
let dirty = false;
const textCache = new Map();

/* =========================
   HILFSFUNKTIONEN
========================= */

function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
}

function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
}

function short(t) {
    return t.length > 28 ? t.slice(0, 27) + "…" : t;
}

function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// amt > 0 hellt auf, amt < 0 dunkelt ab
function shade(hex, amt) {
    const rgb = hexToRgb(hex).map(c => amt > 0 ? c + (255 - c) * amt : c * (1 + amt));
    return "rgb(" + rgb.map(c => Math.round(c)).join(",") + ")";
}

// Schwarz oder Weiß – je nachdem, was auf der Ballfarbe besser lesbar ist
function textColor(hex) {
    const [r, g, b] = hexToRgb(hex).map(c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#141414" : "#ffffff";
}

function sizeFactor() {
    return clamp(Math.min(W, H * 1.4) / 560, 0.6, 1);
}

function baseRadius(ball) {
    return SIZES[ball.size] * sizeFactor();
}

function radius(ball) {
    return baseRadius(ball) * ball.scale * (1 + ball.lift * 0.06);
}

function findBall(id) {
    return state.balls.find(b => b.id === id);
}

/* =========================
   SPEICHERUNG
========================= */

function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: 2,
            showZones: state.showZones,
            balls: state.balls.map(({ id, text, color, x, y, size }) => ({ id, text, color, x, y, size }))
        }));
    } catch (e) { /* Speicher nicht verfügbar – App läuft trotzdem */ }
    dirty = false;
}

function normalizeBall(b) {
    const pos = v => Number.isFinite(v) ? clamp(v, 0, 1) : 0.3 + Math.random() * 0.4;
    return {
        id: typeof b.id === "string" ? b.id : uid(),
        text: typeof b.text === "string" ? b.text : "",
        color: /^#[0-9a-f]{6}$/i.test(b.color) ? b.color : COLORS[0],
        x: pos(Number(b.x)),
        y: pos(Number(b.y)),
        size: SIZES[b.size] ? b.size : "mittel",
        scale: 0.2,
        lift: 0
    };
}

function load() {
    let data = null;

    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) data = JSON.parse(raw);
    } catch (e) { data = null; }

    // Daten der alten Version übernehmen (Pixel auf 1000×300 → relative Position)
    if (!data) {
        try {
            const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
            if (Array.isArray(legacy)) {
                data = { balls: legacy.map(b => ({ ...b, x: b.x / 1000, y: b.y / 300 })) };
            }
        } catch (e) { /* ignorieren */ }
    }

    if (data && Array.isArray(data.balls)) {
        state.balls = data.balls.slice(0, MAX_BALLS).map(normalizeBall);
        state.showZones = !!data.showZones;

        // doppelte Farben auflösen
        const used = new Set();
        state.balls.forEach(b => {
            if (used.has(b.color)) b.color = COLORS.find(c => !used.has(c)) || b.color;
            used.add(b.color);
        });

        save();
    } else {
        addBall("Aufgabe 1");
        addBall("Aufgabe 2");
        addBall("Aufgabe 3");
    }
}

/* =========================
   BALL HINZUFÜGEN / ENTFERNEN
========================= */

function findFreeSpot(r) {
    let best = { x: W / 2, y: H / 2 }, bestScore = -Infinity;

    for (let t = 0; t < 80; t++) {
        const x = W > 2 * r ? r + Math.random() * (W - 2 * r) : W / 2;
        const y = H > 2 * r ? r + Math.random() * (H - 2 * r) : H / 2;

        let score = Infinity;
        state.balls.forEach(o => {
            score = Math.min(score, Math.hypot(x - o.x * W, y - o.y * H) - baseRadius(o) - r);
        });

        if (score > bestScore) { bestScore = score; best = { x, y }; }
        if (score > 30) break;
    }

    return { x: best.x / W, y: best.y / H };
}

function addBall(text = "", focus = false) {
    if (state.balls.length >= MAX_BALLS) return null;

    const used = new Set(state.balls.map(b => b.color));
    const spot = findFreeSpot(SIZES.mittel * sizeFactor());

    const ball = {
        id: uid(),
        text,
        color: COLORS.find(c => !used.has(c)) || COLORS[0],
        x: spot.x,
        y: spot.y,
        size: "mittel",
        scale: 0.2,
        lift: 0
    };

    state.balls.push(ball);
    renderList();
    save();

    if (focus) {
        const input = document.querySelector(`.row[data-id="${ball.id}"] input`);
        if (input) input.focus();
    }
    return ball;
}

function removeBall(id, asDone) {
    const index = state.balls.findIndex(b => b.id === id);
    if (index < 0) return;

    const ball = state.balls[index];
    popEffect(ball, asDone);

    state.balls.splice(index, 1);
    if (drag && drag.id === id) drag = null;
    if (focusedId === id) focusedId = null;

    undoInfo = { ball: { ...ball, scale: 0.2, lift: 0 }, index };

    renderList();
    save();

    const name = short(ball.text.trim()) || "Aufgabe";
    showToast(asDone ? `„${name}“ erledigt 🎉` : `„${name}“ gelöscht`, true);
}

function undo() {
    if (!undoInfo || state.balls.length >= MAX_BALLS) { hideToast(); return; }

    const { ball, index } = undoInfo;
    const used = new Set(state.balls.map(b => b.color));
    if (used.has(ball.color)) ball.color = COLORS.find(c => !used.has(c)) || ball.color;

    state.balls.splice(Math.min(index, state.balls.length), 0, ball);

    undoInfo = null;
    hideToast();
    renderList();
    save();
}

function cycleColor(ball) {
    const used = new Set(state.balls.filter(o => o !== ball).map(o => o.color));
    const start = COLORS.indexOf(ball.color);

    for (let k = 1; k <= COLORS.length; k++) {
        const c = COLORS[(start + k + COLORS.length) % COLORS.length];
        if (!used.has(c)) { ball.color = c; break; }
    }
    save();
}

function resetAll() {
    if (!confirm("Alle Aufgaben löschen?")) return;

    state.balls = [];
    undoInfo = null;
    hideToast();
    try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignorieren */ }
    renderList();
    save();
}

/* =========================
   POP EFFECT
========================= */

function popEffect(ball, big) {
    const x = ball.x * W, y = ball.y * H, r = radius(ball);
    const count = big ? 45 : 25;

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * (big ? 7 : 4);
        particles.push({
            x: x + Math.cos(angle) * r * 0.6,
            y: y + Math.sin(angle) * r * 0.6,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 5 + 2,
            life: 40, maxLife: 40,
            color: ball.color
        });
    }

    if (big) {
        particles.push({ ring: true, x, y, r, maxR: r * 2.2, life: 25, maxLife: 25, color: ball.color });
    }
}

function drawParticles() {
    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
        p.life--;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);

        if (p.ring) {
            p.r += (p.maxR - p.r) * 0.2;
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            p.vx *= 0.96;
            p.vy = p.vy * 0.96 + 0.15;
            p.x += p.vx;
            p.y += p.vy;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.globalAlpha = 1;
}

/* =========================
   LISTE / EINGABEN
========================= */

function iconButton(label, title, cls, onClick) {
    const btn = document.createElement("button");
    btn.className = "icon-btn " + cls;
    btn.textContent = label;
    btn.title = title;
    btn.setAttribute("aria-label", title);
    btn.onclick = onClick;
    return btn;
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    state.balls.forEach((ball, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.dataset.id = ball.id;

        const dot = document.createElement("button");
        dot.className = "dot";
        dot.style.background = ball.color;
        dot.title = "Farbe wechseln";
        dot.setAttribute("aria-label", "Farbe wechseln");
        dot.onclick = () => { cycleColor(ball); dot.style.background = ball.color; };

        const input = document.createElement("input");
        input.value = ball.text;
        input.placeholder = "Aufgabe " + (i + 1);
        input.maxLength = 80;
        input.oninput = () => { ball.text = input.value; save(); };
        input.onkeydown = (e) => {
            if (e.key === "Enter") { e.preventDefault(); addBall("", true); }
        };
        input.onfocus = () => { focusedId = ball.id; };
        input.onblur = () => { if (focusedId === ball.id) focusedId = null; };

        const select = document.createElement("select");
        select.setAttribute("aria-label", "Größe");
        Object.keys(SIZES).forEach(size => {
            const option = document.createElement("option");
            option.value = size;
            option.textContent = size;
            option.selected = ball.size === size;
            select.appendChild(option);
        });
        select.onchange = () => {
            ball.size = select.value;
            ball.scale = Math.min(ball.scale, 0.8); // kleiner „Hüpfer“ beim Wechsel
            save();
        };

        row.append(
            dot, input, select,
            iconButton("🗑", "Löschen", "del", () => removeBall(ball.id, false))
        );
        list.appendChild(row);
    });

    updateStats();
}

function updateStats() {
    const open = state.balls.length;
    const full = open >= MAX_BALLS;

    document.getElementById("addBtn").disabled = full;
    document.getElementById("limitHint").textContent = full
        ? "Maximal 6 Bälle – erst etwas erledigen 😉"
        : `Noch ${MAX_BALLS - open} ${MAX_BALLS - open === 1 ? "Platz" : "Plätze"} frei`;
}

function updateZonesButton() {
    document.getElementById("zonesBtn").setAttribute("aria-pressed", String(state.showZones));
}

/* =========================
   TOAST / RÜCKGÄNGIG
========================= */

function showToast(text, withUndo) {
    document.getElementById("toastText").textContent = text;
    document.getElementById("undoBtn").style.display = withUndo ? "" : "none";
    document.getElementById("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
}

function hideToast() {
    document.getElementById("toast").classList.remove("show");
}

/* =========================
   TEXT IM BALL
========================= */

function wrapLines(text, maxWidth) {
    const fits = s => ctx.measureText(s).width <= maxWidth;
    const words = text.trim().split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";

    for (let word of words) {
        const test = line ? line + " " + word : word;
        if (fits(test)) { line = test; continue; }

        if (line) { lines.push(line); line = ""; }

        // sehr lange Wörter trennen
        while (word.length > 1 && !fits(word)) {
            let k = word.length - 1;
            while (k > 1 && !fits(word.slice(0, k) + "-")) k--;
            lines.push(word.slice(0, k) + "-");
            word = word.slice(k);
        }
        line = word;
    }

    if (line) lines.push(line);
    return lines;
}

// Sucht die größte Schrift, bei der der Text in den Kreis passt
function layoutText(text, R, baseSize) {
    const key = text + "|" + baseSize + "|" + Math.round(R);
    if (textCache.has(key)) return textCache.get(key);

    const minSize = 9;
    const maxWidth = R * 1.55;
    let result = { size: baseSize, lineHeight: baseSize * 1.15, lines: [] };

    for (let size = baseSize; size >= minSize; size--) {
        ctx.font = `700 ${size}px ${FONT}`;
        const lineHeight = size * 1.15;
        const lines = wrapLines(text, maxWidth);
        const maxLines = Math.max(1, Math.floor((R * 1.5) / lineHeight));

        if (lines.length <= maxLines) {
            result = { size, lineHeight, lines };
            break;
        }

        if (size === minSize) {
            const cut = lines.slice(0, maxLines);
            let last = cut[cut.length - 1];
            while (last.length > 1 && ctx.measureText(last + "…").width > maxWidth) last = last.slice(0, -1);
            cut[cut.length - 1] = last.trimEnd() + "…";
            result = { size, lineHeight, lines: cut };
        }
    }

    if (textCache.size > 300) textCache.clear();
    textCache.set(key, result);
    return result;
}

/* =========================
   ZEICHNEN
========================= */

function drawZones() {
    const w = W / 3;
    ctx.save();

    ctx.fillStyle = "rgba(255,255,255,0.03)";
    ctx.fillRect(0, 0, w, H);

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 8]);
    for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(i * w, 16);
        ctx.lineTo(i * w, H - 16);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = `700 13px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ZONES.forEach((z, i) => ctx.fillText(z.toUpperCase(), w * i + w / 2, 14));

    ctx.restore();
}

function drawBall(ball) {
    const x = ball.x * W, y = ball.y * H;
    const r = radius(ball);
    const R = baseRadius(ball);

    // Ball mit Verlauf und Schatten
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 18 + ball.lift * 16;
    ctx.shadowOffsetY = 6 + ball.lift * 8;

    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    g.addColorStop(0, shade(ball.color, 0.35));
    g.addColorStop(0.6, ball.color);
    g.addColorStop(1, shade(ball.color, -0.2));

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Markierung, wenn das zugehörige Eingabefeld aktiv ist
    if (focusedId === ball.id) {
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, r + 6, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Text
    const layout = layoutText(ball.text, R, Math.round(FONT_BASE[ball.size] * sizeFactor()));
    if (!layout.lines.length) return;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(r / R, r / R);
    ctx.font = `700 ${layout.size}px ${FONT}`;
    ctx.fillStyle = textColor(ball.color);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    layout.lines.forEach((line, i) => {
        ctx.fillText(line, 0, (i - (layout.lines.length - 1) / 2) * layout.lineHeight);
    });
    ctx.restore();
}

function drawEmptyState() {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = `18px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Alles erledigt 🎉 – oder füge einen Ball hinzu", W / 2, H / 2);
}

/* =========================
   PHYSIK: Bälle schieben sich sanft auseinander
========================= */

function clampBall(ball) {
    const r = baseRadius(ball);
    ball.x = W > 2 * r ? clamp(ball.x * W, r, W - r) / W : 0.5;
    ball.y = H > 2 * r ? clamp(ball.y * H, r, H - r) / H : 0.5;
}

function physics() {
    const balls = state.balls;

    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            let dx = (b.x - a.x) * W, dy = (b.y - a.y) * H;
            let d = Math.hypot(dx, dy);
            const minDist = baseRadius(a) + baseRadius(b) + 8;
            if (d >= minDist) continue;

            if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }

            const push = (minDist - d) * 0.12;
            const ux = dx / d, uy = dy / d;
            const aHeld = drag && drag.id === a.id;
            const bHeld = drag && drag.id === b.id;
            const wa = aHeld ? 0 : (bHeld ? 1 : 0.5);
            const wb = bHeld ? 0 : (aHeld ? 1 : 0.5);

            a.x -= ux * push * 2 * wa / W;
            a.y -= uy * push * 2 * wa / H;
            b.x += ux * push * 2 * wb / W;
            b.y += uy * push * 2 * wb / H;

            if (push > 0.05) dirty = true;
        }
    }

    balls.forEach(clampBall);
}

/* =========================
   HAUPTSCHLEIFE
========================= */

function frame() {
    ctx.clearRect(0, 0, W, H);

    if (state.showZones) drawZones();

    physics();

    const held = drag ? findBall(drag.id) : null;

    state.balls.forEach(ball => {
        ball.scale += (1 - ball.scale) * 0.15;
        ball.lift += ((ball === held ? 1 : 0) - ball.lift) * 0.2;
    });

    // der gezogene Ball liegt immer oben
    state.balls.forEach(ball => { if (ball !== held) drawBall(ball); });
    if (held) drawBall(held);

    if (!state.balls.length) drawEmptyState();

    drawParticles();

    requestAnimationFrame(frame);
}

/* =========================
   CANVAS-GRÖSSE (scharf auf Retina, passt sich dem Fenster an)
========================= */

function resize() {
    const rect = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    textCache.clear();
}

/* =========================
   ZIEHEN (Maus + Touch) & DOPPELKLICK
========================= */

function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function hitTest(px, py) {
    if (drag) {
        const held = findBall(drag.id);
        if (held && Math.hypot(px - held.x * W, py - held.y * H) <= radius(held)) return held;
    }
    for (let i = state.balls.length - 1; i >= 0; i--) {
        const b = state.balls[i];
        if (Math.hypot(px - b.x * W, py - b.y * H) <= radius(b)) return b;
    }
    return null;
}

canvas.addEventListener("pointerdown", (e) => {
    const p = pointerPos(e);
    const ball = hitTest(p.x, p.y);
    if (!ball) return;

    canvas.setPointerCapture(e.pointerId);
    drag = {
        id: ball.id,
        pointerId: e.pointerId,
        offX: p.x - ball.x * W,
        offY: p.y - ball.y * H,
        startX: p.x,
        startY: p.y,
        moved: false
    };
    canvas.style.cursor = "grabbing";
});

canvas.addEventListener("pointermove", (e) => {
    const p = pointerPos(e);

    if (!drag) {
        canvas.style.cursor = hitTest(p.x, p.y) ? "grab" : "default";
        return;
    }
    if (e.pointerId !== drag.pointerId) return;

    const ball = findBall(drag.id);
    if (!ball) { drag = null; return; }

    if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 4) drag.moved = true;

    ball.x = (p.x - drag.offX) / W;
    ball.y = (p.y - drag.offY) / H;
    clampBall(ball);
});

function endDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;

    const { id, moved } = drag;
    drag = null;
    canvas.style.cursor = "default";
    save();

    // Doppelklick / Doppeltipp = erledigt
    if (!moved) {
        const now = performance.now();
        if (lastTap.id === id && now - lastTap.time < 350) {
            lastTap = { id: null, time: 0 };
            removeBall(id, true);
        } else {
            lastTap = { id, time: now };
        }
    }
}

canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

/* =========================
   START
========================= */

document.getElementById("addBtn").onclick = () => addBall("", true);
document.getElementById("resetBtn").onclick = resetAll;
document.getElementById("undoBtn").onclick = undo;
document.getElementById("zonesBtn").onclick = () => {
    state.showZones = !state.showZones;
    updateZonesButton();
    save();
};

document.getElementById("date").textContent =
    new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });

new ResizeObserver(resize).observe(stage);
resize();

load();
renderList();
updateZonesButton();

// nach dem Laden der Schrift Textmaße neu berechnen
if (document.fonts) document.fonts.ready.then(() => textCache.clear());

// Positionen, die die Physik verschoben hat, regelmäßig sichern
setInterval(() => { if (dirty) save(); }, 1000);
window.addEventListener("pagehide", save);

requestAnimationFrame(frame);
</script>

</body>
</html>
